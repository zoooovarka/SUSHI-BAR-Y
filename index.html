<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Суши-шеф</title>
<style>
/* ===================== БАЗА ===================== */
:root{
  --ink:#3b2416; --panel:#fff4de; --panel-b:#e0b77a;
  --red:#e2552b; --red-d:#a9381a; --green:#46a84b; --green-d:#2c7a31;
  --blue:#3f8fd8; --blue-d:#255f9a; --purple:#8a4fd8; --purple-d:#5c2f9e; --gold:#ffc83d;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1f130c;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#2b1a10;font-size:30px}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}

/* ===================== СПРАЙТЫ ===================== */
.spr{display:inline-flex;align-items:center;justify-content:center;width:var(--s);height:var(--s);position:relative;flex:none;pointer-events:none;vertical-align:middle}
.spr img{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.spr .emo{font-size:calc(var(--s) * .78);line-height:1;position:relative;display:inline-block;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.spr .badge{position:absolute;right:-.2em;bottom:-.12em;font-size:.46em;font-style:normal;background:#fff;border-radius:50%;
  width:1.35em;height:1.35em;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.emo.burnt{filter:brightness(.3) sepia(1) saturate(.4)}
.emo.wrong{filter:grayscale(.85) brightness(.8)}
.emo.gray{filter:grayscale(1) brightness(.75);opacity:.5}

/* ===================== КНОПКИ ===================== */
.btn{border:none;border-radius:24px;padding:14px 34px;font-size:34px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(#ff8a4c,var(--red));box-shadow:0 7px 0 var(--red-d),0 10px 18px rgba(0,0,0,.25);
  display:inline-flex;align-items:center;justify-content:center;gap:12px;text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--red-d)}
.btn.green{background:linear-gradient(#6fd06f,var(--green));box-shadow:0 7px 0 var(--green-d),0 10px 18px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#69b3f3,var(--blue));box-shadow:0 7px 0 var(--blue-d),0 10px 18px rgba(0,0,0,.25)}
.btn.ad{background:linear-gradient(#b083f0,var(--purple));box-shadow:0 7px 0 var(--purple-d),0 10px 18px rgba(0,0,0,.25)}
.btn.off{background:linear-gradient(#b9aea0,#8f8579);box-shadow:0 7px 0 #625a51;opacity:.8;cursor:default}
.btn.small{font-size:26px;padding:10px 20px;border-radius:18px}
.ibtn{width:84px;height:84px;border-radius:24px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(#fff6e6,#f0d7ac);box-shadow:0 6px 0 #b98a4c,0 8px 14px rgba(0,0,0,.25);position:relative;padding:0}
.ibtn:active{transform:translateY(3px);box-shadow:0 3px 0 #b98a4c}
.ibtn .dot{position:absolute;right:-6px;top:-6px;width:30px;height:30px;border-radius:50%;background:#ff3b30;color:#fff;
  font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.pill{background:rgba(40,20,8,.55);color:#fff;border-radius:44px;padding:6px 24px 6px 10px;display:inline-flex;align-items:center;
  gap:10px;font-size:34px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.topbar{position:absolute;left:0;right:0;top:0;height:110px;display:flex;align-items:center;gap:18px;padding:0 26px;z-index:5}
.topbar .grow{flex:1}
.title-txt{font-size:48px;font-weight:900;color:#fff;text-shadow:0 4px 0 #6b3a17,0 6px 12px rgba(0,0,0,.4);white-space:nowrap}

/* ===================== ЗАГРУЗКА ===================== */
#scr-loading{background:radial-gradient(circle at 50% 40%,#ffd9a0,#e8955a 60%,#b2552a)}
#scr-loading .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.logo-big{font-size:120px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 8px 0 #a9381a,0 14px 24px rgba(0,0,0,.35)}
.loadbar{width:600px;height:34px;border-radius:20px;background:rgba(0,0,0,.25);overflow:hidden;border:4px solid #fff}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(#ffe27a,#ffb02e);transition:width .2s}

/* ===================== КАРТА МИРА ===================== */
#scr-world{background:
  radial-gradient(ellipse 380px 260px at 330px 600px,#b9dd8a 60%,transparent 62%),
  radial-gradient(ellipse 330px 240px at 640px 380px,#a8d27a 60%,transparent 62%),
  radial-gradient(ellipse 380px 250px at 920px 640px,#b9dd8a 60%,transparent 62%),
  radial-gradient(ellipse 320px 230px at 1160px 360px,#a8d27a 60%,transparent 62%),
  radial-gradient(ellipse 330px 240px at 1390px 600px,#b9dd8a 60%,transparent 62%),
  linear-gradient(#7fd0f0,#3f9ad0)}
#scr-world.has-bg,#scr-levels.has-bg,#scr-shop.has-bg{background-size:cover;background-position:center}
.map-svg{position:absolute;inset:0;pointer-events:none}
.deco{position:absolute;pointer-events:none;opacity:.9}
.rnode{position:absolute;width:240px;margin-left:-120px;margin-top:-110px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:none;background:none;padding:0}
.rnode .disc{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe7c2 60%,#f0be7a);
  border:8px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.18),0 14px 26px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;position:relative}
.rnode.locked .disc{filter:grayscale(.85) brightness(.85)}
.rnode .lockb{position:absolute;right:-6px;bottom:-6px}
.rnode .name{margin-top:12px;background:#fff;border-radius:20px;padding:6px 18px;font-size:30px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap}
.rnode .req{margin-top:6px;font-size:26px;font-weight:800;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.6);display:flex;align-items:center;gap:4px}
.rnode.open .disc{animation:pulse 1.6s infinite}

/* ===================== КАРТА УРОВНЕЙ ===================== */
#scr-levels{background:linear-gradient(#ffe2b8,#f3b77a)}
.lnode{position:absolute;width:120px;height:120px;margin-left:-60px;margin-top:-60px;border-radius:50%;border:7px solid #fff;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ffb27a,#e2552b);color:#fff;font-size:48px;font-weight:900;padding:0;
  box-shadow:0 8px 0 rgba(0,0,0,.2),0 12px 20px rgba(0,0,0,.25);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.lnode.done{background:radial-gradient(circle at 35% 30%,#8ee08e,#3d9a42)}
.lnode.locked{background:radial-gradient(circle at 35% 30%,#d9d1c6,#9d9488);cursor:default}
.lnode.current{animation:pulseN 1.2s infinite}
.lnode .lst{position:absolute;left:50%;top:104px;transform:translateX(-50%);display:flex;white-space:nowrap}
.lnode .lck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

/* ===================== МАГАЗИН ===================== */
#scr-shop{background:linear-gradient(#f9e2bd,#e8b880)}
#shop-cols{position:absolute;left:20px;right:20px;top:112px;bottom:12px;display:flex;gap:18px}
.scol{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.scol h3{margin:0;font-size:32px;text-align:center;color:#fff;text-shadow:0 3px 0 #8a4a1c}
.ucard{background:var(--panel);border-radius:22px;padding:8px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 #c99a5c;min-height:110px}
.ucard .ui{width:84px;height:84px;border-radius:18px;background:#ffe7c0;display:flex;align-items:center;justify-content:center;flex:none}
.ucard .ut{flex:1;min-width:0}
.ucard .un{font-size:26px;font-weight:900;line-height:1.1}
.ucard .uv{font-size:21px;color:#7a5236;font-weight:700;margin-top:2px;line-height:1.2}
.ucard .dots{display:flex;gap:6px;margin-top:5px}
.ucard .dots i{width:20px;height:20px;border-radius:50%;background:#e0cdb0;border:3px solid #c9ab80}
.ucard .dots i.on{background:var(--gold);border-color:#d99a1a}
.ucard .ub{display:flex;gap:8px;align-items:center;flex:none}
.ucard .btn{min-width:140px}
.ucard .btn.adi{min-width:0;width:74px;height:62px;padding:0}

/* ===================== ЭКРАН УРОВНЯ ===================== */
#scr-game{background:#3a2618}
#hud{position:absolute;left:0;top:0;width:1600px;height:80px;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:6;
  background:linear-gradient(#6a4222,#4a2d16);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.35)}
#hud .pill{font-size:32px;padding:4px 18px 4px 8px}
#hud-timer.warn{background:#c62e1e;animation:pulse .6s infinite}
#hud-goal{flex:1;display:flex;align-items:center;gap:12px;padding-right:20px;min-width:0}
#goalbar{position:relative;flex:1;height:30px;border-radius:16px;background:rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.6)}
#goalbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:linear-gradient(#ffe27a,#ffad1f);width:0;transition:width .3s}
#goalbar .mk{position:absolute;top:50%;transform:translate(-50%,-50%);filter:grayscale(1) brightness(.8);transition:filter .3s}
#goalbar .mk.on{filter:none;animation:pop .4s}
#hud-combo{position:relative;overflow:hidden;min-width:120px;justify-content:center;background:linear-gradient(#ff7a2e,#d9381a);visibility:hidden}
#hud-combo.on{visibility:visible}
#hud-combo i{position:absolute;left:0;bottom:0;height:6px;background:#fff6a0;width:0}
#hall{position:absolute;left:0;top:80px;width:1600px;height:380px;overflow:hidden;
  background:linear-gradient(90deg,rgba(120,70,30,.35) 6px,transparent 6px) 0 0/200px 100%,
   linear-gradient(rgba(120,70,30,.35) 6px,transparent 6px) 0 0/100% 120px,linear-gradient(#fbecd2,#f1d6ad)}
#hall.has-bg{background-size:cover;background-position:center}
#people{position:absolute;inset:0}
#counter{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:20;
  background:linear-gradient(#b0743f,#7a4a24);border-top:8px solid #d39a5e;box-shadow:0 -6px 12px rgba(0,0,0,.25)}
.vis{position:absolute;left:0;bottom:0;width:200px;height:380px;z-index:5;will-change:transform}
.vis.walking{z-index:3}
.vis.out{z-index:2}
.fig{position:absolute;left:50%;bottom:0;width:200px;height:240px;margin-left:-100px}
.vis.walking .fig{animation:walk .36s infinite alternate}
.fig .torso{position:absolute;left:35px;bottom:0;width:130px;height:120px;border-radius:64px 64px 12px 12px;background:var(--shirt);
  box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.fig .head{position:absolute;left:50%;bottom:86px;margin-left:-68px}
.fig .full{position:absolute;left:0;bottom:0}
.fig .mood{position:absolute;right:0;top:-6px;animation:pop .35s}
.vis.angry .fig{animation:stomp .25s infinite alternate}
.bubble{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;border-radius:28px;padding:10px 14px 12px;z-index:4;
  box-shadow:0 6px 0 rgba(0,0,0,.1),0 8px 16px rgba(0,0,0,.2);min-width:150px;animation:popB .35s ease-out}
.bubble:after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:16px solid #fff}
.ord{display:flex;gap:8px;justify-content:center}
.oi{width:86px;height:86px;border-radius:18px;background:#fff1dc;display:flex;align-items:center;justify-content:center;position:relative}
.oi.done{background:#d9f5d0}
.oi.done .spr{opacity:.45}
.oi .ok{position:absolute;right:2px;bottom:-4px;font-size:40px;color:#2c9a31;font-weight:900;text-shadow:0 2px 0 #fff}
.pat{height:16px;margin-top:8px;border-radius:9px;background:#eadfcf;overflow:hidden}
.pat i{display:block;height:100%;width:100%;background:#4fbf4f;border-radius:9px}

#kitchen{position:absolute;left:0;top:460px;width:1600px;height:440px;display:flex;justify-content:center;align-items:stretch;gap:16px;padding:16px;
  background:linear-gradient(45deg,#d7cbb6 25%,transparent 25%,transparent 75%,#d7cbb6 75%) 0 0/80px 80px,
   linear-gradient(45deg,#d7cbb6 25%,transparent 25%,transparent 75%,#d7cbb6 75%) 40px 40px/80px 80px,#e9e0cf}
#kitchen.has-bg{background-size:cover;background-position:center}
.zone{background:rgba(255,246,230,.93);border-radius:26px;padding:14px;display:flex;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.18)}
.z-asm{flex-direction:column}
.irow{display:flex;gap:12px;justify-content:center}
.ingr{width:120px;height:120px;border-radius:24px;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#c58a52,#94602f);box-shadow:inset 0 0 0 6px #6d4320,0 6px 0 #4e2f14;position:relative}
.ingr:active{transform:translateY(3px) scale(.96)}
.mats{flex:1;display:flex;gap:12px;justify-content:center}
.mat{width:156px;border-radius:20px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(90deg,#b9c97a 0 14px,#9cad5c 14px 16px,#c4d388 16px 30px,#9cad5c 30px 32px);
  box-shadow:inset 0 0 0 5px #7f8f44,0 6px 0 #5d6b2c}
.mat.has-img{background-size:cover;background-position:center}
/* Внешний вид оборудования по ступени улучшения: дерево → бронза → серебро → золото */
.tier-1{--frame:#c07a3a}
.tier-2{--frame:#b9c3cc}
.tier-3{--frame:#ffcc33}
.mat.tier-1,.mat.tier-2,.mat.tier-3{box-shadow:inset 0 0 0 7px var(--frame),0 6px 0 #5d6b2c}
.mat.tier-2{background:repeating-linear-gradient(90deg,#c7d98a 0 14px,#a9bb68 14px 16px,#d3e29a 16px 30px,#a9bb68 30px 32px)}
.mat.tier-3{background:repeating-linear-gradient(90deg,#e4d28a 0 14px,#c7b25c 14px 16px,#f0e2a2 16px 30px,#c7b25c 30px 32px)}
.fryer.tier-1,.fryer.tier-2,.fryer.tier-3{box-shadow:inset 0 0 0 8px var(--frame),0 6px 0 #3a4048}
.fryer.tier-3{background:linear-gradient(#e3c46a,#b48a2a)}
.fryer.tier-2{background:linear-gradient(#c8d0d8,#8d97a2)}
.disp.tier-1,.disp.tier-2,.disp.tier-3{box-shadow:inset 0 0 0 7px var(--frame),0 6px 0 #8f6430}
.disp.tier-3{background:linear-gradient(#fff3c4,#f2d27a)}
.tierstars{position:absolute;left:6px;top:4px;font-size:18px;letter-spacing:-2px;z-index:2;pointer-events:none}
.slot-it{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column}
.tops{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:flex;gap:2px}
.rolling .slot-it{animation:roll .5s infinite alternate}
.ready .slot-it{animation:readyGlow 1s infinite alternate}
.mat.wrong{box-shadow:inset 0 0 0 5px #c62e1e,0 6px 0 #7d1a10}
.bar{position:absolute;left:12px;right:12px;bottom:12px;height:14px;border-radius:8px;background:rgba(0,0,0,.3);overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:#ffd23d;border-radius:8px}
.bar.on{display:block}
.z-fry{align-items:center}
.fcol{display:flex;flex-direction:column;gap:12px;align-items:center}
.tray{display:grid;grid-template-columns:repeat(2,64px);gap:8px;padding:8px;border-radius:18px;background:#d9c3a0;box-shadow:inset 0 3px 6px rgba(0,0,0,.2)}
.tslot{width:64px;height:64px;border-radius:14px;background:#f4e6cf;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fryer{position:relative;display:grid;grid-template-columns:repeat(2,108px);gap:12px;padding:14px;border-radius:24px;
  background:linear-gradient(#9aa3ad,#6c757f);box-shadow:inset 0 0 0 6px #4d555e,0 6px 0 #3a4048}
.fryer.has-img{background-size:cover;background-position:center}
.basket{width:108px;height:108px;border-radius:18px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#ffd877,#e8a73a);box-shadow:inset 0 0 0 5px #8b6a2e}
.basket.cook .slot-it{animation:sizzle .25s infinite alternate}
.basket.ready{background:radial-gradient(circle,#c7f59a,#6cc04a)}
.basket.ready .slot-it{animation:readyGlow .8s infinite alternate}
.basket.burnt{background:radial-gradient(circle,#776a5a,#3c342b)}
.basket .bar{bottom:8px;left:8px;right:8px;height:12px}
.z-side{flex-direction:column;align-items:center}
.drow{display:flex;gap:12px}
.disp{width:160px;height:232px;border-radius:24px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:10px;gap:6px;background:linear-gradient(#fbe8c9,#ecc996);box-shadow:inset 0 0 0 5px #c79a5a,0 6px 0 #8f6430}
.disp .portions{display:flex;gap:2px;min-height:52px;align-items:center}
.disp .pe{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.12)}
.disp .bar{bottom:14px}
.disp.full{outline:5px solid #46a84b;outline-offset:-5px}
.trashb{width:150px;height:130px;border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;
  background:linear-gradient(#d9dde2,#aab0b8);box-shadow:inset 0 0 0 5px #7d848c,0 6px 0 #5a6067}
.trash-on .trashb{background:linear-gradient(#ff8f7a,#e2402b);box-shadow:inset 0 0 0 5px #a9281a,0 6px 0 #7d1a10;animation:pulse .7s infinite}
.trash-on .mat,.trash-on .basket,.trash-on .tslot{outline:5px dashed rgba(226,64,43,.85);outline-offset:-5px}
.shake{animation:shake .4s !important}

#fx{position:absolute;inset:0;pointer-events:none;z-index:60}
.flyer{position:absolute;transition:transform .35s cubic-bezier(.3,.7,.4,1),opacity .35s;z-index:61}
.ftxt{position:absolute;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:#ffd23d;white-space:nowrap;
  text-shadow:0 3px 0 #7a3d0a,0 0 10px rgba(0,0,0,.4);animation:floatUp 1.3s ease-out forwards}
.ftxt.minus{color:#ff5a4a;text-shadow:0 3px 0 #5a0a0a}
.ftxt.small{font-size:30px}
.bigcombo{position:absolute;left:800px;top:250px;transform:translate(-50%,-50%);font-size:110px;font-weight:900;color:#fff;white-space:nowrap;
  text-shadow:0 6px 0 #c2401b,0 0 30px rgba(255,140,40,.9);animation:comboPop 1.1s ease-out forwards;z-index:65}
.bigcombo small{display:block;font-size:48px;text-align:center;color:#ffe27a}
#hand{position:absolute;display:none;z-index:70;pointer-events:none;transition:left .25s,top .25s}
#hand .in{animation:tapHand 1s infinite;transform-origin:30% 10%}

/* ===================== МОДАЛКИ ===================== */
#modal{position:absolute;inset:0;background:rgba(25,12,4,.62);display:none;align-items:center;justify-content:center;z-index:100}
#modal.on{display:flex}
.panel{background:var(--panel);border-radius:40px;padding:30px 44px 36px;min-width:640px;max-width:1500px;text-align:center;
  border:7px solid var(--panel-b);box-shadow:0 18px 0 rgba(0,0,0,.2),0 24px 40px rgba(0,0,0,.35);animation:pop .3s ease-out;position:relative}
.panel h2{margin:0 0 12px;font-size:56px;font-weight:900;color:var(--red);text-shadow:0 3px 0 #ffd9b0}
.panel p{margin:10px 0;font-size:32px}
.btns{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:6px 0 10px}
.bigstars .spr:nth-child(2){transform:translateY(-24px)}
.bigstars .got{animation:pop .5s ease-out both}
.row-ico{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.resrow{display:flex;justify-content:center;gap:22px;margin:8px 0}
.resrow div{display:flex;align-items:center;gap:6px;font-size:38px;font-weight:900;background:#fff;border-radius:20px;padding:6px 20px}
.newdish{background:#fff;border-radius:26px;padding:14px 22px;margin:14px auto 0;display:inline-flex;flex-direction:column;align-items:center;gap:6px;border:4px dashed #ffb02e}
.newdish b{color:var(--red);font-size:30px}
.goals{display:flex;gap:26px;justify-content:center;margin:10px 0}
.goals div{display:flex;align-items:center;gap:6px;font-size:34px;font-weight:900;background:#fff;border-radius:18px;padding:6px 16px}
.days{display:flex;gap:12px;justify-content:center;margin:18px 0}
.day{width:124px;height:164px;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;font-weight:900;font-size:26px;border:5px solid #ecd2a6;position:relative}
.day.done{background:#d9f5d0;border-color:#8fd08a}
.day.cur{border-color:var(--red);animation:pulse 1.2s infinite}
.day .chk{position:absolute;right:-8px;top:-10px;font-size:40px;color:#2c9a31}
.lb{min-width:760px;margin:10px 0}
.lb .r{display:flex;align-items:center;gap:16px;background:#fff;border-radius:16px;padding:6px 18px;margin:7px 0;font-size:30px;font-weight:800;text-align:left}
.lb .r.me{background:#ffe7b0}
.lb .r .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .r img{width:44px;height:44px;border-radius:50%}
.achs{display:grid;grid-template-columns:repeat(3,440px);gap:10px;margin-top:6px;text-align:left}
.ach{background:#fff;border-radius:18px;padding:8px 12px;display:flex;align-items:center;gap:10px;min-height:112px;border:4px solid #f0dcb8}
.ach.ready{border-color:#46a84b;background:#efffe9}
.ach.done{opacity:.7;background:#f3efe8}
.ach .ai{width:72px;height:72px;border-radius:16px;background:#ffe7c0;display:flex;align-items:center;justify-content:center;flex:none}
.ach .at{flex:1;min-width:0}
.ach .an{font-size:23px;font-weight:900;line-height:1.1}
.ach .ad{font-size:18px;color:#7a5236;line-height:1.15;margin-top:2px}
.ach .ap{height:12px;border-radius:7px;background:#eadfcf;margin-top:5px;overflow:hidden}
.ach .ap i{display:block;height:100%;background:#ffb02e}
.ach .ar{flex:none;display:flex;flex-direction:column;align-items:center;font-size:22px;font-weight:900;gap:2px}
.ach .btn{padding:8px 12px;font-size:22px;border-radius:14px;min-width:0}
.closex{position:absolute;right:-24px;top:-24px}
.adfake{position:absolute;inset:0;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;font-size:44px;gap:20px}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:rgba(40,20,8,.9);color:#fff;font-size:32px;font-weight:800;
  padding:14px 32px;border-radius:24px;z-index:150;display:none;white-space:nowrap;align-items:center;gap:10px}
#toast.on{display:flex;animation:pop .25s}

/* ===================== ПОВОРОТ ===================== */
#rotate{position:fixed;inset:0;background:#2b1a10;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:1000;text-align:center;font-size:24px;font-weight:800;padding:20px}
#rotate.on{display:flex}
#rotate .ph{font-size:90px;animation:rot 1.8s infinite}

/* ===================== АНИМАЦИИ ===================== */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes pulseN{0%,100%{box-shadow:0 8px 0 rgba(0,0,0,.2),0 0 0 0 rgba(255,255,255,.8)}50%{box-shadow:0 8px 0 rgba(0,0,0,.2),0 0 0 18px rgba(255,255,255,0)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes popB{0%{transform:translateX(-50%) scale(.4);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes walk{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(-12px) rotate(3deg)}}
@keyframes stomp{0%{transform:translateY(0) rotate(-6deg)}100%{transform:translateY(-6px) rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes roll{0%{transform:scaleX(1) rotate(-4deg)}100%{transform:scaleX(.82) rotate(4deg)}}
@keyframes sizzle{0%{transform:translateY(0)}100%{transform:translateY(-3px)}}
@keyframes readyGlow{0%{filter:drop-shadow(0 0 0 #fff6a0)}100%{filter:drop-shadow(0 0 14px #fff6a0)}}
@keyframes floatUp{0%{opacity:0;margin-top:20px}15%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-110px}}
@keyframes comboPop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}
  35%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
@keyframes tapHand{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(0,-18px) scale(1.06)}}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let LANG = 'ru';

  let s = (TEXT[LANG] && TEXT[LANG][key]) || TEXT.ru[key] || key;
  args.forEach((v, i) => { s = s.split('{' + i + '}').join(v); });
  return s;
}

   ===================================================================== */
const SPR_OK = {};
function preloadSprites(onProgress) {
  const list = Object.entries(CONFIG.sprites).filter(([, v]) => v.file);
  let done = 0;
  const all = list.map(([k, v]) => new Promise(res => {
    const im = new Image();
    const fin = ok => { if (ok) SPR_OK[k] = true; done++; onProgress && onProgress(done / list.length); res(); };
    im.onload = () => fin(true);
    im.onerror = () => fin(false);
    im.src = CONFIG.imgPath + v.file;
  }));
  return withTimeout(Promise.all(all), 8000).catch(() => {});
}
// HTML спрайта заданного размера
function spr(key, size, cls = '') {
  const d = CONFIG.sprites[key] || { emoji: '❔' };
  const inner = SPR_OK[key]
    ? `<img src="${CONFIG.imgPath}${d.file}" alt="" draggable="false">`
    : `<span class="emo ${d.css || ''}">${d.emoji || ''}${d.badge ? `<i class="badge">${d.badge}</i>` : ''}</span>`;
  return `<span class="spr ${cls}" style="--s:${size}px">${inner}</span>`;
}
const sprUrl = key => `url("${CONFIG.imgPath}${CONFIG.sprites[key].file}")`;
// Фон экрана/зоны из спрайта (если файл загрузился)
function applyBg(el, key) {
  if (key && SPR_OK[key]) { el.style.backgroundImage = sprUrl(key); el.classList.add('has-bg'); }
}

/* =====================================================================
   ЗВУК: синтезированные эффекты WebAudio (без файлов)
   ===================================================================== */
const Sound = {
  ctx: null, master: null,
  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.35;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    this.sync();
  },
  // Звук работает только если включён и нет внешней паузы (реклама, свёрнутая вкладка)
  sync() {
    if (!this.ctx) return;
    const want = Save.data.sound && pauseReasons.size === 0;
    if (want && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    else if (!want && this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
  },
  tone(f, dur, type = 'sine', vol = 0.3, delay = 0, f2 = 0) {
    const c = this.ctx, t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  play(name, arg) {
    if (!this.ctx || !Save.data.sound || this.ctx.state !== 'running') return;
    try {
      switch (name) {
        case 'click': this.tone(660, 0.07, 'triangle', 0.2); break;
        case 'place': this.tone(420, 0.08, 'triangle', 0.25, 0, 520); break;
        case 'roll':  this.tone(300, 0.15, 'sawtooth', 0.08, 0, 500); break;
        case 'ready': this.tone(880, 0.1, 'sine', 0.25); this.tone(1175, 0.15, 'sine', 0.2, 0.08); break;
        case 'serve': this.tone(523, 0.1, 'triangle', 0.3); this.tone(784, 0.14, 'triangle', 0.25, 0.06); break;
        case 'coin':  this.tone(988, 0.08, 'square', 0.12); this.tone(1319, 0.2, 'square', 0.12, 0.07); break;
        case 'heart': this.tone(784, 0.1, 'sine', 0.25); this.tone(1047, 0.18, 'sine', 0.25, 0.09); break;
        case 'combo': { const base = 440 * Math.pow(1.19, arg || 2); [0, 0.07, 0.14].forEach((d, i) => this.tone(base * [1, 1.26, 1.5][i], 0.14, 'triangle', 0.25, d)); break; }
        case 'bad':   this.tone(200, 0.15, 'square', 0.12, 0, 150); break;
        case 'trash': this.tone(180, 0.18, 'sawtooth', 0.12, 0, 90); break;
        case 'burn':  this.tone(140, 0.4, 'sawtooth', 0.15, 0, 70); break;
        case 'angry': this.tone(330, 0.2, 'square', 0.15, 0, 220); this.tone(220, 0.3, 'square', 0.15, 0.18, 160); break;
        case 'bell':  this.tone(1568, 0.3, 'sine', 0.15); this.tone(2093, 0.4, 'sine', 0.1, 0.05); break;
        case 'win':   [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.25, i * 0.11)); break;
        case 'lose':  [392, 330, 262].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.25, i * 0.18)); break;
        case 'ach':   [659, 784, 988, 1319].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.22, i * 0.08)); break;
        case 'tick':  this.tone(1200, 0.04, 'square', 0.08); break;
      }
    } catch (e) {}
  }
};

const pauseReasons = new Set();
function addPause(r) { pauseReasons.add(r); syncGameplay(); }
function removePause(r) { pauseReasons.delete(r); syncGameplay(); }

/* =====================================================================
   ЯНДЕКС SDK (с заглушками для локального запуска)
   ===================================================================== */
const SDK = {
  ysdk: null, player: null, gameplayOn: false, lbObj: null,
  async init() {
    if (typeof YaGames === 'undefined') return;
    try { this.ysdk = await withTimeout(YaGames.init(), 6000); } catch (e) { this.ysdk = null; return; }
    try { this.player = await withTimeout(this.ysdk.getPlayer({ scopes: false }), 5000); } catch (e) { this.player = null; }
    try {
      if (this.ysdk.on) {
        this.ysdk.on('game_api_pause', () => { addPause('sdk'); autoPauseLevel(); });
        this.ysdk.on('game_api_resume', () => removePause('sdk'));
      }
    } catch (e) {}
  },
  lang() {
    try { if (this.ysdk) return this.ysdk.environment.i18n.lang; } catch (e) {}
    return (navigator.language || 'ru').slice(0, 2);
  },
  ready() { try { this.ysdk && this.ysdk.features.LoadingAPI && this.ysdk.features.LoadingAPI.ready(); } catch (e) {} },
  // GameplayAPI.start / stop — только при смене состояния
  gameplay(on) {
    if (on === this.gameplayOn) return;
    this.gameplayOn = on;
    try {
      const api = this.ysdk && this.ysdk.features.GameplayAPI;
      if (api) on ? api.start() : api.stop();
    } catch (e) {}
  },
  // Полноэкранная реклама (только между уровнями)
  showFullscreen(done) {
    if (!this.ysdk) { done && done(); return; }
    let fin = false;
    const finish = () => { if (fin) return; fin = true; removePause('ad'); done && done(); };
    addPause('ad');
    try {
      this.ysdk.adv.showFullscreenAdv({ callbacks: { onClose: () => finish(), onError: () => finish(), onOffline: () => finish() } });
    } catch (e) { finish(); }
  },
  // Реклама за вознаграждение: награда выдаётся ТОЛЬКО в onRewarded
  showRewarded(onReward, onDone) {
    if (!this.ysdk) { this.fakeRewarded(onReward, onDone); return; }
    let closed = false;
    const close = () => { if (closed) return; closed = true; removePause('ad'); onDone && onDone(); };
    addPause('ad');
    try {
      this.ysdk.adv.showRewardedVideo({ callbacks: {
        onOpen: () => {},
        onRewarded: () => { onReward(); },
        onClose: () => close(),
        onError: () => { toast(t('adError')); close(); }
      } });
    } catch (e) { toast(t('adError')); close(); }
  },
  // Локальная заглушка ролика
  fakeRewarded(onReward, onDone) {
    addPause('ad');
    const d = document.createElement('div');
    d.className = 'adfake';
    d.innerHTML = `<div>${spr('ic_ad', 120)}</div><div>${t('adFake')}</div>`;
    byId('stage').appendChild(d);
    setTimeout(() => { d.remove(); onReward(); removePause('ad'); onDone && onDone(); }, DEBUG ? 50 : 1200);
  },
  async getData() {
    if (!this.player) return null;
    try { const d = await withTimeout(this.player.getData(['save']), 5000); return d && d.save ? d.save : null; } catch (e) { return null; }
  },
  setData(save) {
    if (!this.player) return;
    try { this.player.setData({ save }, true).catch(() => {}); } catch (e) {}
  },
  // Лидерборд: новый API ysdk.leaderboards с откатом на getLeaderboards()
  async lb() {
    if (!this.ysdk) return null;
    if (this.ysdk.leaderboards) return { v2: true, o: this.ysdk.leaderboards };
    if (!this.lbObj && this.ysdk.getLeaderboards) {
      try { this.lbObj = await withTimeout(this.ysdk.getLeaderboards(), 5000); } catch (e) { return null; }
    }
    return this.lbObj ? { v2: false, o: this.lbObj } : null;
  },
  async setScore(score) {
    try {
      const lb = await this.lb(); if (!lb) return;
      if (lb.v2) await lb.o.setScore(CONFIG.leaderboard, score);
      else await lb.o.setLeaderboardScore(CONFIG.leaderboard, score);
    } catch (e) {}
  },
  async getEntries() {
    try {
      const lb = await this.lb(); if (!lb) return null;
      const opts = { quantityTop: 5, includeUser: true, quantityAround: 2 };
      return lb.v2 ? await lb.o.getEntries(CONFIG.leaderboard, opts) : await lb.o.getLeaderboardEntries(CONFIG.leaderboard, opts);
    } catch (e) { return null; }
  }
};

/* =====================================================================
   СОХРАНЕНИЯ: облако игрока + localStorage как запасной вариант
   ===================================================================== */
const Save = {
  data: null,
  fresh() {
    return { v: 1, ts: 0, coins: 0, sound: true, rest: {}, daily: { last: '', streak: 0 }, freeUpAt: 0, ach: {},
      stats: { served: 0, hearts: 0, rolls: 0, tempura: 0, maxCombo: 0, noBurnLevels: 0, perfectLevels: 0, threeStars: 0, bigOrders: 0, upgrades: 0 } };
  },
  async load() {
    let local = null;
    try { local = JSON.parse(localStorage.getItem(CONFIG.saveKey) || 'null'); } catch (e) {}
    const cloud = await SDK.getData();
    let best = local;
    if (cloud && (!best || (cloud.ts || 0) > (best.ts || 0))) best = cloud;
    const f = this.fresh();
    this.data = Object.assign(f, best || {});
    this.data.stats = Object.assign(this.fresh().stats, (best && best.stats) || {});
    if (!this.data.daily) this.data.daily = { last: '', streak: 0 };
    if (!this.data.ach) this.data.ach = {};
  },
  write() {
    this.data.ts = Date.now();
    try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(this.data)); } catch (e) {}
    SDK.setData(this.data);
  }
};
function restSave(id) {
  const r = Save.data.rest;
  if (!r[id]) r[id] = { stars: [], up: {} };
  if (!r[id].stars) r[id].stars = [];
  if (!r[id].up) r[id].up = {};
  return r[id];
}
function totalStars() {
  let s = 0;
  for (const id in Save.data.rest) (Save.data.rest[id].stars || []).forEach(v => { s += v || 0; });
  return s;
}
const restStars = id => (restSave(id).stars || []).reduce((a, b) => a + (b || 0), 0);
const restById = id => CONFIG.restaurants.find(r => r.id === id);

/* =====================================================================
   УЛУЧШЕНИЯ: параметры станций берутся из текущей ступени
   ===================================================================== */
const upTier = (R, id) => restSave(R.id).up[id] || 0;
const upDef = (R, id) => R.upgrades.find(u => u.id === id);
// Индекс «имя параметра -> улучшение» (строится один раз на ресторан)
function paramIndex(R) {
  if (!R._params) {
    R._params = {};
    R.upgrades.forEach(u => Object.entries(u.params).forEach(([name, p]) => { R._params[name] = { up: u, p }; }));
  }
  return R._params;
}
function paramVal(R, name) {
  const e = paramIndex(R)[name];
  if (!e) return 1;
  return e.p.v[Math.min(upTier(R, e.up.id), e.p.v.length - 1)];
}
// Параметр станции: число, имя параметра или массив имён (перемножаются)
function pv(R, v) {
  if (typeof v === 'number') return v;
  if (Array.isArray(v)) return v.reduce((a, n) => a * pv(R, n), 1);
  return paramVal(R, v);
}
const dishPrice = (R, dish) => { const d = R.dishes[dish]; return Math.round(d.price * (d.priceUp ? paramVal(R, d.priceUp) : 1)); };
function fmtParam(p, v) {
  if (p.fmt === 'sec') return t('sec', Math.round(v * 10) / 10);
  if (p.fmt === 'mult') return '+' + Math.round((v - 1) * 100) + '%';
  if (p.fmt === 'time') return v >= 1 ? '0%' : '−' + Math.round((1 - v) * 100) + '%';
  return String(v);
}

/* =====================================================================
   СТАТИСТИКА И ДОСТИЖЕНИЯ
   ===================================================================== */
function statValue(id) {
  if (id === 'stars') return totalStars();
  if (id === 'levelsDone') { const R = CONFIG.restaurants[0]; return restSave(R.id).stars.filter(s => s > 0).length; }
  return Save.data.stats[id] || 0;
}
function stat(id, add) { Save.data.stats[id] = (Save.data.stats[id] || 0) + add; checkAch(); }
function statMax(id, v) { if (v > (Save.data.stats[id] || 0)) { Save.data.stats[id] = v; checkAch(); } }
// Открываем достижения, цель которых выполнена; награду игрок забирает сам
function checkAch() {
  for (const a of CONFIG.achievements) {
    if (Save.data.ach[a.id]) continue;
    if (statValue(a.stat) >= a.goal) {
      Save.data.ach[a.id] = 'ready';
      toast(t('achUnlocked', tr(a.name)), 'medal');
      Sound.play('ach');
    }
  }
}

const stage = byId('stage');
let SCALE = 1;
function fit() {
  const W = window.innerWidth, H = window.innerHeight;
  SCALE = Math.min(W / 1600, H / 900);
  stage.style.transform = `translate(${(W - 1600 * SCALE) / 2}px,${(H - 900 * SCALE) / 2}px) scale(${SCALE})`;
  checkRotate();
}
const isTouch = () => ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
function checkRotate() {
  const portrait = isTouch() && window.innerHeight > window.innerWidth;
  byId('rotate').classList.toggle('on', portrait);
  if (portrait) { if (!pauseReasons.has('rotate')) { addPause('rotate'); autoPauseLevel(); } }
  else if (pauseReasons.has('rotate')) removePause('rotate');
}
// Прямоугольник элемента в координатах сцены 1600x900
function stageRect(el) {
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: (r.left - s.left) / SCALE, y: (r.top - s.top) / SCALE, w: r.width / SCALE, h: r.height / SCALE };
}

// Строки «было → станет»: показываем только параметры, которые меняются на следующей ступени
function upgradeLines(u, tier) {

  return ps.filter(p => p.v[tier + 1] !== p.v[tier])
    .map(p => (p.label ? esc(tr(p.label)) + ': ' : '') + fmtParam(p, p.v[tier]) + ' → <b>' + fmtParam(p, p.v[tier + 1]) + '</b>')

}

async function openLeaders() {
  openModal(`<button class="ibtn closex" data-act="close">${spr('ic_close', 48)}</button>
    <h2>${esc(t('leaderboard'))}</h2><div class="lb" id="lb-list"><p>${esc(t('loadingLb'))}</p></div>`);
  const res = await SDK.getEntries();
  const box = byId('lb-list'); if (!box) return;
  const my = Save.data.stats.hearts;
  if (!res || !res.entries) {
    box.innerHTML = `<p>${esc(t('lbUnavailable'))}</p><div class="r me"><span>—</span><span class="n">${esc(t('you'))}</span>${spr('heart', 40)}${my}</div>`;
    return;
  }
  box.innerHTML = res.entries.slice(0, 9).map(e => {
    const me = res.userRank && e.rank === res.userRank;
    let av = '';
    try { const src = e.player.getAvatarSrc && e.player.getAvatarSrc('small'); if (src) av = `<img src="${esc(src)}" alt="">`; } catch (er) {}
    const name = (e.player && e.player.publicName) || '—';
    return `<div class="r ${me ? 'me' : ''}"><span>#${e.rank}</span>${av}<span class="n">${esc(name)}</span>${spr('heart', 40)}${e.score}</div>`;
  }).join('') || '<p>—</p>';
}

let G = null;
const isRunning = () => screen === 'game' && G && G.state === 'play' && !G.paused && pauseReasons.size === 0 && !modalOpen();
function syncGameplay() { SDK.gameplay(isRunning()); Sound.sync(); }
// Автопауза: свернули вкладку, повернули телефон, SDK попросил
function autoPauseLevel() { if (screen === 'game' && G && G.state === 'play' && !G.paused) openPause(); }

function stationActive(st, menu) {
  if (st.type === 'assembly') return st.recipes.some(r => menu.includes(r.dish));
  if (st.type === 'fryer' || st.type === 'dispenser') return menu.includes(st.dish);
  return true; // мусорка
}
// Позиции мест у стойки (по центру зала)
function seatX(i, n) { return 800 + (i - (n - 1) / 2) * 360; }

function startLevel(idx) {
  const R = restById(curRest), L = R.levels[idx];
  const nSeats = L.seats || R.seats;
  G = {
    R, L, idx, time: L.time, elapsed: 0, coins: 0, hearts: 0, served: 0, angry: 0, burnt: 0, vid: 0,
    seats: new Array(nSeats).fill(null), vis: [], spawnT: 0.8,
    comboN: 0, lastServe: -99, bestCombo: 0,
    st: {}, stations: [], dishStation: {}, trash: false,
    state: 'play', paused: false, addUsed: false, finalized: false, doubled: false,
    introServed: false, hintT: 0, botT: 0, lastTick: 99, hasFryer: false
  };
  // Активные станции и параметры с учётом улучшений
  for (const st of R.stations) {
    if (!stationActive(st, L.menu)) continue;
    const s = { tier: st.look ? upTier(R, st.look) : 0 };
    if (st.type === 'assembly') {
      s.n = pv(R, st.slots); s.time = pv(R, st.time);
      s.slots = new Array(s.n).fill(null);
      s.recipes = st.recipes.filter(r => L.menu.includes(r.dish));
      s.tops = st.toppings.filter(tp => s.recipes.some(r => r.set.includes(tp)));
      s.recipes.forEach(r => { G.dishStation[r.dish] = st; });
    } else if (st.type === 'fryer') {
      s.n = pv(R, st.slots); s.time = pv(R, st.time); s.burn = pv(R, st.burn);
      s.slots = new Array(s.n).fill(null); s.tray = new Array(s.n).fill(null);
      G.dishStation[st.dish] = st; G.hasFryer = true;
    } else if (st.type === 'dispenser') {
      s.cap = pv(R, st.cap); s.fill = pv(R, st.fill); s.count = 0; s.t = 0;
      G.dishStation[st.dish] = st;
    }
    G.st[st.id] = s; G.stations.push(st);
  }
  closeModal();
  buildGameDOM();
  show('game');
}

/* =====================================================================
   УРОВЕНЬ: логика
   ===================================================================== */
function pickDish() {
  const R = G.R, L = G.L;
  if (L.intro && Math.random() < 0.4) return L.intro; // новое блюдо встречается чаще
  const total = L.menu.reduce((a, m) => a + (R.dishes[m].weight || 1), 0);
  let r = Math.random() * total;
  for (const m of L.menu) { r -= (R.dishes[m].weight || 1); if (r <= 0) return m; }
  return L.menu[0];
}
// Посетитель входит слева и идёт к свободному месту
function spawnVisitor(seat) {
  const R = G.R, L = G.L;
  const n = rndInt(L.items[0], L.items[1]);
  const order = []; for (let i = 0; i < n; i++) order.push({ dish: pickDish(), done: false });
  const max = L.patience * paramVal(R, 'patience') * (1 + (n - 1) * R.patiencePerExtraItem);
  const v = { id: ++G.vid, seat, x: -140, tx: seatX(seat, G.seats.length), state: 'in', mood: 'wait',
    skin: pick(R.visitors), shirt: pick(R.shirts), order, pat: max, max };
  G.seats[seat] = v.id;
  G.vis.push(v);
}
function update(dt) {
  if (!G || G.state !== 'play') return;
  const L = G.L;
  G.time -= dt; G.elapsed += dt;
  // Приход посетителей (за 5 секунд до конца новые не приходят)
  if (G.time > 5) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      const free = []; G.seats.forEach((id, i) => { if (!id) free.push(i); });
      if (free.length) { spawnVisitor(pick(free)); G.spawnT = rnd(L.every[0], L.every[1]); }
      else G.spawnT = 0.6;
    }
  }
  // Посетители: ходьба и терпение
  const sp = CONFIG.walkSpeed * dt;
  for (const v of G.vis) {
    if (v.state === 'in') {
      v.x = Math.min(v.tx, v.x + sp);
      if (v.x >= v.tx) { v.state = 'wait'; Sound.play('bell'); }
    } else if (v.state === 'wait') {
      v.pat -= dt;
      if (v.pat <= 0) { v.pat = 0; visitorLeave(v, false); }
    } else if (v.state === 'out') {
      v.x += v.dir * sp;
    }
  }
  G.vis = G.vis.filter(v => !(v.state === 'out' && (v.x < -220 || v.x > 1820)));
  // Станции
  for (const st of G.stations) {
    const s = G.st[st.id];
    if (st.type === 'assembly') {
      s.slots.forEach(it => {
        if (it && it.state === 'roll') {
          it.t += dt;
          if (it.t >= s.time) {
            it.state = it.dish ? 'ready' : 'wrong';
            Sound.play(it.dish ? 'ready' : 'bad');
            if (it.dish) stat('rolls', 1);
          }
        }
      });
    } else if (st.type === 'fryer') {
      s.slots.forEach(it => {
        if (!it) return;
        it.t += dt;
        if (it.state === 'cook' && it.t >= s.time) { it.state = 'ready'; it.t = 0; Sound.play('ready'); stat('tempura', 1); }
        else if (it.state === 'ready' && it.t >= s.burn) { it.state = 'burnt'; it.t = 0; G.burnt++; Sound.play('burn'); }
      });
    } else if (st.type === 'dispenser') {
      if (s.count < s.cap) { s.t += dt; if (s.t >= s.fill) { s.count++; s.t = 0; } } else s.t = 0;
    }
  }
  const sec = Math.ceil(G.time);
  if (sec <= 5 && sec > 0 && sec !== G.lastTick) { G.lastTick = sec; Sound.play('tick'); }
  if (G.time <= 0) { G.time = 0; endLevel(); }
}
// Уход: довольный — направо, сердитый — налево
function visitorLeave(v, happy) {
  v.state = 'out'; v.mood = happy ? 'happy' : 'angry'; v.dir = happy ? 1 : -1;
  G.seats[v.seat] = null;
  if (!happy) { G.angry++; Sound.play('angry'); }
}
// Подать блюдо первому подходящему посетителю (по порядку прихода)
function serveDish(dish, fromEl) {
  const cands = G.vis.filter(v => v.state === 'wait' && v.order.some(o => !o.done && o.dish === dish)).sort((a, b) => a.id - b.id);
  if (!cands.length) return false;
  const v = cands[0], R = G.R;
  const j = v.order.findIndex(o => !o.done && o.dish === dish);
  v.order[j].done = true;
  v.pat = Math.min(v.max, v.pat + v.max * R.patienceRefill);
  fly(fromEl, $(`#vis-${v.id} [data-oi="${j}"]`), R.dishes[dish].sprite);
  Sound.play('serve');
  if (G.L.intro === dish) G.introServed = true;
  // Комбо: подачи подряд с паузой меньше окна наращивают множитель x2..x4
  G.comboN = (G.elapsed - G.lastServe <= R.combo.window) ? G.comboN + 1 : 1;
  G.lastServe = G.elapsed;
  const mult = Math.min(R.combo.bonus.length + 1, G.comboN);
  if (mult >= 2) {
    const bonus = R.combo.bonus[mult - 2];
    G.coins += bonus;
    bigCombo(mult, bonus);
    Sound.play('combo', mult);
    if (mult > G.bestCombo) G.bestCombo = mult;
    statMax('maxCombo', mult);
  }
  if (v.order.every(o => o.done)) payVisitor(v);
  return true;
}
function payVisitor(v) {
  const R = G.R;
  const base = v.order.reduce((a, o) => a + dishPrice(R, o.dish), 0);
  const ratio = v.pat / v.max;
  const tier = R.tips.find(x => ratio > x.above);
  const tip = tier ? Math.round(base * tier.bonus * paramVal(R, 'tips')) : 0;
  const sum = base + tip;
  G.coins += sum; G.served++;
  stat('served', 1);
  if (v.order.length >= 3) stat('bigOrders', 1);
  const x = v.x;
  floatText(x, 230, '+' + sum);
  if (tip) setTimeout(() => floatText(x, 290, t('tips', tip), 'small'), 150);
  Sound.play('coin');
  // Сердце за быстрое обслуживание
  if (ratio > R.heartAbove) {
    G.hearts++; stat('hearts', 1);
    const el = byId('vis-' + v.id);
    setTimeout(() => { fly(el, byId('hud-hearts'), 'heart', 70); Sound.play('heart'); }, 200);
  }
  visitorLeave(v, true);
}
function discard(el) { fly(el, byId('k-trash'), 'trash'); Sound.play('trash'); }

// Обработка тапа по кухне
function gameTap(el) {
  const [kind, sid, arg] = el.dataset.g.split(':');
  const st = G.R.stations.find(s => s.id === sid), s = G.st[sid];
  if (kind === 'trash') { G.trash = !G.trash; Sound.play('click'); renderGame(); return; }
  const wasTrash = G.trash;
  G.trash = false; // режим мусорки сбрасывается любым тапом
  if (kind === 'base') {
    const i = s.slots.findIndex(x => !x);
    if (i < 0) { shake(el); Sound.play('bad'); return; }
    s.slots[i] = { state: 'base', tops: [], t: 0, dish: null };
    Sound.play('place');
  } else if (kind === 'top') {
    const it = s.slots.find(x => x && x.state === 'base' && !x.tops.includes(arg));
    if (!it) { shake(el); Sound.play('bad'); return; }
    it.tops.push(arg); Sound.play('place');
  } else if (kind === 'slot') {
    const i = +arg, it = s.slots[i];
    if (!it) { renderGame(); return; }
    if (wasTrash || it.state === 'wrong') { s.slots[i] = null; discard(el); }
    else if (it.state === 'base') {
      if (!it.tops.length) { shake(el); Sound.play('bad'); return; }
      // Рецепт с точным совпадением начинок; иначе получится «неправильный» ролл
      const rec = st.recipes.find(r => r.set.length === it.tops.length && r.set.every(x => it.tops.includes(x)));
      it.dish = rec ? rec.dish : null; it.state = 'roll'; it.t = 0;
      Sound.play('roll');
    } else if (it.state === 'ready') {
      if (serveDish(it.dish, el)) s.slots[i] = null; else { shake(el); Sound.play('bad'); }
    }
  } else if (kind === 'fry') {
    const i = s.slots.findIndex(x => !x);
    if (i < 0) { shake(el); Sound.play('bad'); return; }
    s.slots[i] = { state: 'cook', t: 0 }; Sound.play('place');
  } else if (kind === 'fslot') {
    const i = +arg, it = s.slots[i];
    if (!it) { renderGame(); return; }
    if (it.state === 'burnt' || wasTrash) {
      if (it.state === 'burnt') {
        G.coins = Math.max(0, G.coins - st.penalty);
        const r = stageRect(el); floatText(r.x + r.w / 2, r.y, t('burnt', st.penalty), 'minus');
      }
      s.slots[i] = null; discard(el);
    } else if (it.state === 'ready') {
      // Снимаем с огня: сразу посетителю, иначе на поднос
      if (serveDish(st.dish, el)) s.slots[i] = null;
      else {
        const k = s.tray.findIndex(x => !x);
        if (k >= 0) { s.tray[k] = st.dish; s.slots[i] = null; fly(el, byId(`k-${sid}-t${k}`), G.R.dishes[st.dish].sprite); Sound.play('place'); }
        else { shake(el); Sound.play('bad'); }
      }
    } else shake(el);
  } else if (kind === 'tray') {
    const i = +arg;
    if (!s.tray[i]) { renderGame(); return; }
    if (wasTrash) { s.tray[i] = null; discard(el); }
    else if (serveDish(s.tray[i], el)) s.tray[i] = null; else { shake(el); Sound.play('bad'); }
  } else if (kind === 'disp') {
    if (s.count <= 0) { shake(el); Sound.play('bad'); return; }
    if (serveDish(st.dish, el)) s.count--; else { shake(el); Sound.play('bad'); }
  }
  renderGame();
}

/* =====================================================================
   УРОВЕНЬ: отрисовка (DOM меняется только при смене ключа состояния)
   ===================================================================== */
function setKey(el, key, html) { if (el._k === key) return false; el._k = key; el.innerHTML = html; return true; }
function visitorHTML(v) {
  const R = G.R;
  const fig = SPR_OK[v.skin]
    ? `<span class="full">${spr(v.skin, 200)}</span>`
    : `<div class="torso" style="--shirt:${v.shirt}"></div><span class="head">${spr(v.skin, 136)}</span>`;
  const bubble = v.state === 'wait' ? `<div class="bubble"><div class="ord">${v.order.map((o, j) =>
    `<div class="oi ${o.done ? 'done' : ''}" data-oi="${j}">${spr(R.dishes[o.dish].sprite, 70)}${o.done ? '<b class="ok">✓</b>' : ''}</div>`).join('')}</div>
    <div class="pat"><i></i></div></div>` : '';
  const mood = v.mood !== 'wait' ? `<span class="mood">${spr('mood_' + v.mood, 70)}</span>` : '';
  return `${bubble}<div class="fig">${fig}${mood}</div>`;
}
function renderGame(force) {
  if (!G) return;
  const R = G.R, L = G.L;
  if (force) document.querySelectorAll('#scr-game [id]').forEach(e => { e._k = undefined; });
  // HUD
  byId('hud-time').textContent = fmtTime(G.time);
  byId('hud-timer').classList.toggle('warn', G.time <= 10 && G.state === 'play');
  byId('hud-coins').textContent = G.coins;
  byId('hud-hearts-n').textContent = G.hearts;
  byId('goal-fill').style.width = Math.min(100, G.coins / L.goal[2] * 100) + '%';
  L.goal.forEach((g, k) => byId('mk' + k).classList.toggle('on', G.coins >= g));
  const since = G.elapsed - G.lastServe, comboOn = G.comboN >= 2 && since <= R.combo.window;
  const cEl = byId('hud-combo');
  cEl.classList.toggle('on', comboOn);
  if (comboOn) {
    byId('hud-combo-n').textContent = 'x' + Math.min(R.combo.bonus.length + 1, G.comboN);
    cEl.lastElementChild.style.width = Math.max(0, 100 - since / R.combo.window * 100) + '%';
  }
  // Посетители
  const box = byId('people'), alive = new Set();
  for (const v of G.vis) {
    alive.add('vis-' + v.id);
    let el = byId('vis-' + v.id);
    if (!el) { el = document.createElement('div'); el.id = 'vis-' + v.id; el.className = 'vis'; box.appendChild(el); }
    const key = v.state + '|' + v.mood + '|' + v.order.map(o => (o.done ? 1 : 0)).join('');
    if (setKey(el, key, visitorHTML(v))) {
      el.className = 'vis ' + (v.state === 'wait' ? '' : 'walking ') + (v.state === 'out' ? 'out ' : '') + (v.mood === 'angry' ? 'angry' : '');
      el._pat = el.querySelector('.pat i');
    }
    el.style.transform = `translateX(${v.x - 100}px)`;
    if (el._pat) {
      const r = v.pat / v.max;
      el._pat.style.width = (r * 100) + '%';
      el._pat.style.background = r > 0.66 ? '#4fbf4f' : r > 0.33 ? '#f2b630' : '#e2402b';
    }
  }
  [...box.children].forEach(c => { if (!alive.has(c.id)) c.remove(); });
  // Станции
  for (const st of G.stations) {
    const s = G.st[st.id], k = 'k-' + st.id;
    if (st.type === 'assembly') {
      s.slots.forEach((it, i) => {
        const el = byId(`${k}-s${i}`), box2 = el.querySelector('.slot-it'), bar = el.querySelector('.bar');
        const state = it ? it.state : 'empty';
        if (setKey(box2, it ? state + '|' + it.tops.join(',') + '|' + it.dish : 'empty', !it ? '' :
          (state === 'ready' ? spr(R.dishes[it.dish].sprite, 124)
            : state === 'wrong' ? spr(st.wrong, 124)
            : `${spr(st.base, 116)}<div class="tops">${it.tops.map(tp => spr(tp, 52)).join('')}</div>`))) {
          el.classList.remove('rolling', 'ready', 'wrong', 'base');
          if (state !== 'empty') el.classList.add(state === 'roll' ? 'rolling' : state);
        }
        bar.classList.toggle('on', state === 'roll');
        if (state === 'roll') bar.firstElementChild.style.width = Math.min(100, it.t / s.time * 100) + '%';
      });
    } else if (st.type === 'fryer') {
      s.slots.forEach((it, i) => {
        const el = byId(`${k}-s${i}`), box2 = el.firstElementChild, bar = el.lastElementChild;
        const state = it ? it.state : 'empty';
        if (setKey(box2, state, !it ? '' : spr(state === 'cook' ? st.input : state === 'ready' ? R.dishes[st.dish].sprite : st.burnt, 92)))
          el.className = 'basket ' + state;
        bar.classList.toggle('on', state === 'cook' || state === 'ready');
        const fill = bar.firstElementChild;
        if (state === 'cook') { fill.style.width = Math.min(100, it.t / s.time * 100) + '%'; fill.style.background = '#ffd23d'; }
        else if (state === 'ready') { fill.style.width = Math.max(0, 100 - it.t / s.burn * 100) + '%'; fill.style.background = it.t / s.burn > 0.6 ? '#e2402b' : '#3fbf3f'; }
      });
      s.tray.forEach((d, i) => setKey(byId(`${k}-t${i}`), d || '', d ? spr(R.dishes[d].sprite, 56) : ''));
    } else if (st.type === 'dispenser') {
      const el = byId(k), por = el.querySelector('.portions'), bar = el.querySelector('.bar');
      let h = ''; for (let i = 0; i < s.cap; i++) h += i < s.count ? spr(R.dishes[st.dish].sprite, 46) : '<span class="pe"></span>';
      setKey(por, s.count + '/' + s.cap, h);
      el.classList.toggle('full', s.count >= s.cap);
      bar.classList.toggle('on', s.count < s.cap);
      if (s.count < s.cap) bar.firstElementChild.style.width = Math.min(100, s.t / s.fill * 100) + '%';
    }
  }
  byId('kitchen').classList.toggle('trash-on', !!G.trash);
}

/* =====================================================================
   ПОДСКАЗКИ: рука-указатель ищет следующее полезное действие
   ===================================================================== */
function readySources(dish) {
  const out = [];
  for (const st of G.stations) {
    const s = G.st[st.id], k = 'k-' + st.id;
    if (st.type === 'assembly') s.slots.forEach((x, i) => { if (x && x.state === 'ready' && x.dish === dish) out.push(byId(`${k}-s${i}`)); });
    else if (st.type === 'fryer' && st.dish === dish) {
      s.slots.forEach((x, i) => { if (x && x.state === 'ready') out.push(byId(`${k}-s${i}`)); });
      s.tray.forEach((x, i) => { if (x) out.push(byId(`${k}-t${i}`)); });
    } else if (st.type === 'dispenser' && st.dish === dish && s.count > 0) out.push(byId(k));
  }
  return out;
}
function computeHint() {
  const trashEl = byId('k-trash');
  // 1. Сгоревшее и неправильное — выбросить
  for (const st of G.stations) {
    const s = G.st[st.id], k = 'k-' + st.id;
    if (st.type === 'fryer') { const i = s.slots.findIndex(x => x && x.state === 'burnt'); if (i >= 0) return byId(`${k}-s${i}`); }
    if (st.type === 'assembly') { const i = s.slots.findIndex(x => x && x.state === 'wrong'); if (i >= 0) return byId(`${k}-s${i}`); }
  }
  const needs = [];
  G.vis.filter(v => v.state === 'wait').sort((a, b) => a.id - b.id)
    .forEach(v => v.order.forEach(o => { if (!o.done) needs.push(o.dish); }));
  // 2. Подать готовое
  for (const d of needs) { const r = readySources(d); if (r.length) return r[0]; }
  // 3. Начать или продолжить готовку
  const used = new Set(); let blocked = null;
  const toTrash = (sid, i) => (G.trash ? byId(`k-${sid}-s${i}`) : trashEl);
  for (const d of needs) {
    const st = G.dishStation[d]; if (!st) continue;
    const s = G.st[st.id], k = 'k-' + st.id;
    if (st.type === 'assembly') {
      const rec = s.recipes.find(r => r.dish === d).set;
      let i = s.slots.findIndex((x, j) => x && x.state === 'roll' && x.dish === d && !used.has(k + j));
      if (i >= 0) { used.add(k + i); continue; }
      i = s.slots.findIndex((x, j) => x && x.state === 'base' && !used.has(k + j) && x.tops.every(tp => rec.includes(tp)));
      if (i >= 0) {
        const it = s.slots[i], miss = rec.filter(tp => !it.tops.includes(tp));
        if (!miss.length) return byId(`${k}-s${i}`);
        const land = s.slots.findIndex(x => x && x.state === 'base' && !x.tops.includes(miss[0]));
        if (land === i) return byId(`${k}-top-${miss[0]}`);
        return toTrash(st.id, land); // начинка ляжет не туда — убираем мешающую основу
      }
      if (s.slots.some(x => !x)) return byId(`${k}-base`);
      blocked = blocked || st;
    } else if (st.type === 'fryer') {
      const i = s.slots.findIndex((x, j) => x && x.state === 'cook' && !used.has(k + j));
      if (i >= 0) { used.add(k + i); continue; }
      if (s.slots.some(x => !x)) return byId(`${k}-in`);
    }
  }
  // 4. Все циновки заняты ненужным — освободить
  if (blocked) {
    const s = G.st[blocked.id], k = 'k-' + blocked.id;
    const i = s.slots.findIndex((x, j) => x && !used.has(k + j) && (x.state === 'ready' || x.state === 'base'));
    if (i >= 0) return toTrash(blocked.id, i);
  }
  return null;
}
const hintsOn = () => G && (G.L.tutorial || (G.L.intro && !G.introServed));
function updateHand() {
  const hand = byId('hand');
  const target = isRunning() && hintsOn() ? computeHint() : null;
  if (!target) { hand.style.display = 'none'; return; }
  const r = stageRect(target);
  if (hand.style.display !== 'block') { hand.style.display = 'block'; hand.firstElementChild.innerHTML = spr('hand', 96); }
  hand.style.left = (r.x + r.w / 2 - 30) + 'px';
  hand.style.top = (r.y + r.h / 2) + 'px';
}

/* =====================================================================
   КОНЕЦ УРОВНЯ, ПАУЗА, РЕЗУЛЬТАТЫ
   ===================================================================== */
const calcStars = () => G.L.goal.filter(g => G.coins >= g).length;
function endLevel() {
  G.state = 'end'; G.trash = false;
  renderGame();
  const stars = calcStars();
  if (stars > 0) { finalize(); Sound.play('win'); } else Sound.play('lose');
  showResult();
  syncGameplay();
}
// Зачисление монет, звёзд и статистики (один раз за попытку)
function finalize() {
  if (G.finalized) return;
  G.finalized = true;
  const rs = restSave(G.R.id), stars = calcStars();
  if (stars > (rs.stars[G.idx] || 0)) rs.stars[G.idx] = stars;
  if (stars > 0) {
    if (G.angry === 0) Save.data.stats.perfectLevels++;
    if (G.hasFryer && G.burnt === 0) Save.data.stats.noBurnLevels++;
    if (stars === 3) Save.data.stats.threeStars++;
  }
  Save.data.coins += G.coins;
  checkAch();
  Save.write();
  SDK.setScore(Save.data.stats.hearts);
}
function showResult() {
  const stars = calcStars(), win = stars > 0;
  const info = `<div class="resrow"><div>${spr('coin', 50)}${G.coins * (G.doubled ? 2 : 1)}</div><div>${spr('heart', 46)}${G.hearts}</div>
    ${G.bestCombo >= 2 ? `<div>${spr('combo', 46)}x${G.bestCombo}</div>` : ''}</div>`;
  if (win) {
    openModal(`
      <h2>${esc(t('win'))}</h2>
      <div class="bigstars">${starsRow(stars, 130)}</div>${info}
      <div class="btns">
        ${!G.doubled && G.coins > 0 ? `<button class="btn ad" data-act="double">${spr('ic_ad', 48)}${esc(t('doubleCoins'))}</button>` : ''}
        <button class="btn blue" data-act="res" data-arg="retry">${esc(t('retry'))}</button>
        <button class="btn" data-act="res" data-arg="shop">${spr('ic_shop', 44)}${esc(t('shop'))}</button>
        <button class="btn green" data-act="res" data-arg="next">${esc(t('next'))} ▶</button>
      </div>`);
  } else {
    openModal(`
      <h2>${esc(t('lose'))}</h2>
      <div class="bigstars">${starsRow(0, 110)}</div>
      <p>${esc(t('needCoins', G.L.goal[0], G.coins))}</p>${info}
      <div class="btns">
        ${!G.addUsed ? `<button class="btn ad" data-act="addtime">${spr('ic_ad', 48)}${esc(t('addTime', CONFIG.addTimeSec))}</button>` : ''}
        <button class="btn blue" data-act="res" data-arg="retry">${esc(t('retry'))}</button>
        <button class="btn" data-act="res" data-arg="map">${esc(t('toMap'))}</button>
      </div>`);
  }
}
// Выход с экрана результата: зачисление, полноэкранная реклама, переход
function leaveResult(dest) {
  finalize();
  const idx = G.idx;
  closeModal();
  G.state = 'done';
  syncGameplay();
  SDK.showFullscreen(() => {
    if (dest === 'retry') startLevel(idx);
    else if (dest === 'shop') goShop();
    else goLevels();
  });
}
function openPause() {
  if (!G) return;
  G.paused = true;
  openModal(`
    <h2>${esc(t('pause'))}</h2>
    <div class="btns" style="flex-direction:column;align-items:center">
      <button class="btn green" data-act="resume" style="min-width:420px">▶ ${esc(t('resume'))}</button>
      <button class="btn blue" data-act="restart" style="min-width:420px">${esc(t('retry'))}</button>
      <button class="btn" data-act="quit" style="min-width:420px">${esc(t('toMap'))}</button>
      <div>${soundBtn()}</div>
    </div>`);
  syncGameplay();
}

/* =====================================================================
   КНОПКИ ИНТЕРФЕЙСА (data-act)
   ===================================================================== */
const ACT = {
  sound() {
    Save.data.sound = !Save.data.sound; Save.write(); Sound.sync();
    document.querySelectorAll('[data-act="sound"]').forEach(b => { b.innerHTML = spr(Save.data.sound ? 'ic_sound' : 'ic_mute', 56); });
  },
  close() { closeModal(); syncGameplay(); },
  world() { goWorld(); },
  rest(id) {
    const r = restById(id);
    if (totalStars() < r.starsRequired) { toast(t('locked', r.starsRequired)); Sound.play('bad'); return; }
    if (r.comingSoon) { toast(t('comingSoon')); return; }
    curRest = id; goLevels();
  },
  lvl(i) {
    if (!levelUnlocked(restById(curRest), +i)) { toast(t('levelLocked')); Sound.play('bad'); return; }
    openLevelIntro(+i);
  },
  start(i) { startLevel(+i); },
  shop() { goShop(); },
  shopback() { goLevels(); },
  buy(id) { buyUpgrade(id, false); },
  freeup(id) {
    if (freeUpLeft() > 0) { toast(t('noAdYet')); return; }
    SDK.showRewarded(() => buyUpgrade(id, true), () => renderShop());
  },
  daily() { openDaily(); },
  claim() { claimDaily(); },
  achs() { openAchs(); },
  achclaim(id) { claimAch(id); },
  leaders() { openLeaders(); },
  pause() { if (G && G.state === 'play') openPause(); },
  resume() { G.paused = false; closeModal(); syncGameplay(); },
  restart() { const i = G.idx; G.state = 'done'; closeModal(); startLevel(i); },
  quit() { G.state = 'done'; closeModal(); Save.write(); goLevels(); },
  double() {
    if (G.doubled) return;
    SDK.showRewarded(() => {
      // Награда — только здесь (onRewarded)
      if (G.doubled) return;
      G.doubled = true; Save.data.coins += G.coins; Save.write(); Sound.play('coin');
    }, () => { if (G.state === 'end') showResult(); });
  },
  addtime() {
    if (G.addUsed) return;
    SDK.showRewarded(() => {
      // Награда — только здесь (onRewarded)
      G.addUsed = true; G.time += CONFIG.addTimeSec; G.state = 'play'; G.lastTick = 99;
    }, () => { if (G.state === 'play') { closeModal(); syncGameplay(); } else showResult(); });
  },
  res(dest) { if (G && G.state === 'end') leaveResult(dest); }
};

/* =====================================================================
   ГЛАВНЫЙ ЦИКЛ
   ===================================================================== */
let lastT = performance.now(), secT = 0;
const SPEED = DEBUG ? (+((location.search.match(/speed=(\d+)/) || [])[1]) || 1) : 1;
let BOT = DEBUG && /bot/.test(location.search);
const BOT_DT = DEBUG ? (+((location.search.match(/botdt=([\d.]+)/) || [])[1]) || 0.35) : 0.35;
function loop(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (screen === 'game' && G) {
    if (isRunning()) {
      let rem = dt * SPEED;
      while (rem > 0 && G.state === 'play') {
        const step = Math.min(rem, 0.05); rem -= step; update(step);
        // Бот для проверки баланса (только ?debug&bot)
        if (BOT && G.state === 'play') { G.botT -= step; if (G.botT <= 0) { G.botT = BOT_DT; const h = computeHint(); if (h) gameTap(h); } }
      }
    }
    renderGame();
    G.hintT -= dt;
    if (G.hintT <= 0) { G.hintT = 0.2; updateHand(); }
  }
  // Раз в секунду обновляем таймер бесплатного улучшения
  secT += dt;
  if (secT >= 1) { secT = 0; if (screen === 'shop' && !modalOpen()) renderShop(); }
  requestAnimationFrame(loop);
}

/* =====================================================================
   ВВОД И СОБЫТИЯ
   ===================================================================== */
// Кухня реагирует на касание сразу (pointerdown): быстро и работает мультитач
stage.addEventListener('pointerdown', e => {
  Sound.unlock();
  const el = e.target.closest('[data-g]');
  if (!el) return;
  e.preventDefault();
  if (isRunning()) gameTap(el);
});
// Кнопки интерфейса — обычный click
stage.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  Sound.play('click');
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset.arg, b);
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { addPause('hidden'); autoPauseLevel(); }
  else removePause('hidden');
});
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));
document.addEventListener('gesturestart', e => e.preventDefault());

/* =====================================================================
   ЗАПУСК
   ===================================================================== */
async function boot() {
  fit();
  const bar = byId('load-bar');
  await SDK.init();
  const l = String(SDK.lang() || 'ru').toLowerCase();
  LANG = ['ru', 'be', 'kk', 'uk', 'uz'].includes(l) ? 'ru' : 'en';
  document.documentElement.lang = LANG;
  document.title = t('title');
  byId('load-title').textContent = t('title');
  byId('rotate-txt').textContent = t('rotate');
  bar.style.width = '20%';
  await Promise.all([Save.load(), preloadSprites(p => { bar.style.width = (20 + p * 80) + '%'; })]);
  byId('load-logo').innerHTML = spr('logo', 160);
  bar.style.width = '100%';
  SDK.ready(); // LoadingAPI.ready() — игра готова к взаимодействию
  goWorld();
  if (dailyAvailable()) setTimeout(() => { if (screen === 'world' && !modalOpen()) openDaily(); }, 400);
  requestAnimationFrame(t0 => { lastT = t0; requestAnimationFrame(loop); });
  if (DEBUG) window.GAME = { get G() { return G; }, startLevel, Save, computeHint, setBot(v) { BOT = v; }, restById, goLevels };
}
boot();
</script>
